<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Gym — Coming soon</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: rgba(255,255,255,.92);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        overflow: hidden;
      }
      .glow {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(circle at 50% 0%, rgba(255,0,70,.20), transparent 45%),
          radial-gradient(circle at 50% 100%, rgba(255,0,70,.12), transparent 45%),
          radial-gradient(circle at 50% 30%, rgba(255,255,255,.06), transparent 40%);
        filter: blur(0px);
      }
      .card {
        position: relative;
        width: min(520px, calc(100% - 48px));
        text-align: center;
        padding: 44px 28px;
        border-radius: 22px;
        background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.10);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0,0,0,.55);
      }
      .badge {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.05);
        font-size: 12px;
        color: rgba(255,255,255,.72);
      }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: #ff0033; }
      h1 { margin: 18px 0 0; font-size: 44px; letter-spacing: -0.02em; }
      p  { margin: 14px auto 0; max-width: 38ch; color: rgba(255,255,255,.70); font-size: 16px; line-height: 1.5; }
      .logoBox {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 16px 18px; border-radius: 18px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.05);
        margin-bottom: 18px;
      }
      img { height: 64px; width: auto; display: block; }
      .footer { margin-top: 26px; font-size: 12px; color: rgba(255,255,255,.50); }
    </style>
  </head>

  <body>
    <div class="glow"></div>

    <div class="card">
      <div class="logoBox">
        <img src="/logo-negativo.png" alt="Red Gym" />
      </div>

      <div class="badge">
        <span class="dot"></span>
        Work in progress
      </div>
      <p>Stiamo preparando il nuovo sito di Red Gym.</p>

      <div class="footer">© <span id="y"></span> Red Gym</div>
    </div>

    <script>
      document.getElementById("y").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
